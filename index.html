<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>How to Choose a Telescope</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #f4f4f4;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      background: white;
      border-bottom: 1px solid #ddd;
      flex-shrink: 0;
    }

    .toolbar a {
      color: #1457b5;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .viewer {
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    .viewer iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    @media (max-width: 600px) {
      .toolbar {
        padding: 12px;
      }

      .toolbar a {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <header class="toolbar">
    <strong>How to Choose a Telescope</strong>
    <a href="./How to Choose a Telescope.pdf" target="_blank" rel="noopener">
      Open PDF ↗
    </a>
  </header>

  <main class="viewer">
    <iframe
      src="./How to Choose a Telescope.pdf"
      title="How to Choose a Telescope"
    ></iframe>
  </main>
</body>
</html>
